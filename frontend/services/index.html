<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services Catalog — VyaparOS</title>
  <link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <header class="top-navbar">
        <h1 class="page-title">Services Catalog</h1>
        <div class="top-actions">
          <button class="btn btn-primary" onclick="openAddServiceModal()">
            <span>+</span> Add Service
          </button>
        </div>
      </header>

      <main class="content-body">
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Service Name</th>
                  <th>Description</th>
                  <th>Duration</th>
                  <th>Price</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="servicesTableBody">
                <tr><td colspan="6" style="text-align: center; color: var(--text-dim);">Loading services...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Service Modal -->
  <div id="serviceModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle" class="card-title">Add New Service</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <form id="serviceForm">
        <input type="hidden" id="editServiceId">
        <div class="form-group">
          <label class="form-label">Service Name *</label>
          <input type="text" id="servName" class="form-control" required placeholder="e.g. Haircut & Styling">
        </div>
        <div class="form-group">
          <label class="form-label">Duration (Minutes) *</label>
          <input type="number" id="servDuration" class="form-control" min="5" step="5" value="30" required>
        </div>
        <div class="form-group">
          <label class="form-label">Price (₹) *</label>
          <input type="number" id="servPrice" class="form-control" min="0" step="0.01" value="499.00" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="servDesc" class="form-control" rows="3" placeholder="Service details, inclusions, etc."></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Service</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!API.checkAuthGuard()) return;
      API.renderSidebar('services');
      loadServices();
    });

    async function loadServices() {
      const biz = API.storage.getActiveBusiness();
      if (!biz) return;
      const tbody = document.getElementById('servicesTableBody');

      try {
        const res = await API.request(`/businesses/${biz.businessId}/services`);
        const list = res?.data || [];

        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No services configured yet. Click Add Service to start.</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(s => `
          <tr>
            <td><strong>${s.name}</strong></td>
            <td style="color: var(--text-muted); font-size: 0.85rem;">${s.description || '-'}</td>
            <td>${s.durationMinutes} mins</td>
            <td style="font-weight: 700; color: var(--success);">${API.formatCurrency(s.price, biz.currency)}</td>
            <td>
              <span class="badge ${s.active ? 'badge-success' : 'badge-danger'}">
                ${s.active ? 'ACTIVE' : 'INACTIVE'}
              </span>
            </td>
            <td>
              <button class="btn btn-secondary btn-sm" onclick='editService(${JSON.stringify(s)})'>Edit</button>
              ${s.active ? `<button class="btn btn-danger btn-sm" onclick="deactivateService(${s.id})">Deactivate</button>` : ''}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        API.showToast(err.message || 'Failed to load services', 'error');
      }
    }

    function openAddServiceModal() {
      document.getElementById('editServiceId').value = '';
      document.getElementById('modalTitle').innerText = 'Add New Service';
      document.getElementById('serviceForm').reset();
      document.getElementById('servDuration').value = '30';
      document.getElementById('servPrice').value = '499.00';
      document.getElementById('serviceModal').classList.add('active');
    }

    function editService(s) {
      document.getElementById('editServiceId').value = s.id;
      document.getElementById('modalTitle').innerText = 'Edit Service';
      document.getElementById('servName').value = s.name;
      document.getElementById('servDuration').value = s.durationMinutes;
      document.getElementById('servPrice').value = s.price;
      document.getElementById('servDesc').value = s.description || '';
      document.getElementById('serviceModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('serviceModal').classList.remove('active');
    }

    document.getElementById('serviceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const biz = API.storage.getActiveBusiness();
      const id = document.getElementById('editServiceId').value;

      const payload = {
        name: document.getElementById('servName').value.trim(),
        durationMinutes: parseInt(document.getElementById('servDuration').value),
        price: parseFloat(document.getElementById('servPrice').value),
        description: document.getElementById('servDesc').value.trim()
      };

      try {
        if (id) {
          await API.request(`/businesses/${biz.businessId}/services/${id}`, {
            method: 'PATCH',
            body: JSON.stringify(payload)
          });
          API.showToast('Service updated successfully', 'success');
        } else {
          await API.request(`/businesses/${biz.businessId}/services`, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          API.showToast('Service added successfully', 'success');
        }
        closeModal();
        loadServices();
      } catch (err) {
        API.showToast(err.message, 'error');
      }
    });

    async function deactivateService(id) {
      if (!confirm('Are you sure you want to deactivate this service?')) return;
      const biz = API.storage.getActiveBusiness();
      try {
        await API.request(`/businesses/${biz.businessId}/services/${id}`, { method: 'DELETE' });
        API.showToast('Service deactivated', 'success');
        loadServices();
      } catch (err) {
        API.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
