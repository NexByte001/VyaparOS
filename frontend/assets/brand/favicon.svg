<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="v-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="v-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="v-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#v-glow)" filter="blur(6px)"/>

  <!-- Modern Geometric V Emblem -->
  <!-- Left Wing -->
  <path d="M14 17 L25 17 L32 38 L25.5 38 L14 17 Z" fill="url(#v-grad-1)"/>
  
  <!-- Right Wing with Upward Growth Arrow -->
  <path d="M50 17 L39 17 L32 38 L38.5 38 L50 17 Z" fill="url(#v-grad-2)"/>

  <!-- Central Dynamic Apex Node / Growth Arrow Accent -->
  <polygon points="32,23 38,34 32,45 26,34" fill="#38BDF8" filter="url(#shadow)"/>
  <polygon points="32,26 36,34 32,41 28,34" fill="#FFFFFF"/>
</svg>
