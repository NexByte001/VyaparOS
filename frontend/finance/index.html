<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses & Financial Reports — VyaparOS</title>
  <link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <header class="top-navbar">
        <h1 class="page-title">Expenses & Financial Reports</h1>
        <div class="top-actions">
          <button class="btn btn-primary" onclick="openExpenseModal()">
            <span>+</span> Record Expense
          </button>
        </div>
      </header>

      <main class="content-body">
        <!-- Periodic Financial Summary Card -->
        <div class="card" style="margin-bottom: 24px;">
          <div class="card-header">
            <h2 class="card-title">Financial Performance Overview</h2>
            <div style="display:flex; gap:10px; align-items:center;">
              <input type="date" id="repStart" class="form-control" style="width:auto;" onchange="loadFinancialReport()">
              <span style="color:var(--text-dim);">to</span>
              <input type="date" id="repEnd" class="form-control" style="width:auto;" onchange="loadFinancialReport()">
            </div>
          </div>
          <div class="stats-grid" style="margin-bottom: 0;">
            <div class="stat-card">
              <span class="stat-label">Invoiced Revenue</span>
              <span class="stat-value" id="repInvoiced">₹0.00</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Cash Collected</span>
              <span class="stat-value" id="repCollected" style="color:var(--success);">₹0.00</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Recorded Expenses</span>
              <span class="stat-value" id="repExpenses" style="color:var(--danger);">₹0.00</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Operating Profit</span>
              <span class="stat-value" id="repProfit" style="color:var(--secondary);">₹0.00</span>
            </div>
          </div>
        </div>

        <!-- Expense Transactions Table -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Recorded Expenses</h2>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Vendor</th>
                  <th>Date</th>
                  <th>Method</th>
                  <th>Amount</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="expensesTableBody">
                <tr><td colspan="7" style="text-align: center; color: var(--text-dim);">Loading expenses...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Record Expense Modal -->
  <div id="expenseModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle" class="card-title">Record Business Expense</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <form id="expenseForm">
        <input type="hidden" id="editExpenseId">
        <div class="form-group">
          <label class="form-label">Expense Category *</label>
          <select id="expCategory" class="form-control" required>
            <option value="Rent">Rent</option>
            <option value="Supplies">Supplies & Raw Materials</option>
            <option value="Utilities">Utilities (Electricity, Water, Internet)</option>
            <option value="Salaries">Staff Salaries & Wages</option>
            <option value="Marketing">Marketing & Advertising</option>
            <option value="Equipment">Equipment & Maintenance</option>
            <option value="Other">Other Expenses</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Amount (₹) *</label>
          <input type="number" id="expAmount" class="form-control" min="0.01" step="0.01" required placeholder="5000.00">
        </div>
        <div class="form-group">
          <label class="form-label">Expense Date *</label>
          <input type="date" id="expDate" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Payment Method *</label>
          <select id="expMethod" class="form-control" required>
            <option value="UPI">UPI</option>
            <option value="CASH">Cash</option>
            <option value="BANK_TRANSFER">Bank Transfer / NEFT</option>
            <option value="CARD">Debit / Credit Card</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Vendor / Payee</label>
          <input type="text" id="expVendor" class="form-control" placeholder="e.g. Landlord, Supplier Name">
        </div>
        <div class="form-group">
          <label class="form-label">Description / Remarks</label>
          <input type="text" id="expDesc" class="form-control" placeholder="Optional notes">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!API.checkAuthGuard()) return;
      API.renderSidebar('finance');

      // Default date range: current month
      const now = new Date();
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
      const today = now.toISOString().split('T')[0];
      document.getElementById('repStart').value = firstDay;
      document.getElementById('repEnd').value = today;

      await loadFinancialReport();
      await loadExpenses();
    });

    async function loadFinancialReport() {
      const biz = API.storage.getActiveBusiness();
      if (!biz) return;

      const s = document.getElementById('repStart').value;
      const e = document.getElementById('repEnd').value;

      try {
        const res = await API.request(`/businesses/${biz.businessId}/reports/financial-summary?startDate=${s}&endDate=${e}`);
        const d = res.data;
        document.getElementById('repInvoiced').innerText = API.formatCurrency(d.invoicedRevenue, biz.currency);
        document.getElementById('repCollected').innerText = API.formatCurrency(d.cashCollected, biz.currency);
        document.getElementById('repExpenses').innerText = API.formatCurrency(d.recordedExpenses, biz.currency);
        document.getElementById('repProfit').innerText = API.formatCurrency(d.operatingProfit, biz.currency);
      } catch (err) {
        console.error(err);
      }
    }

    async function loadExpenses() {
      const biz = API.storage.getActiveBusiness();
      if (!biz) return;
      const tbody = document.getElementById('expensesTableBody');

      try {
        const res = await API.request(`/businesses/${biz.businessId}/expenses?size=50`);
        const list = res?.data?.content || [];

        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No expenses recorded yet</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(exp => `
          <tr>
            <td><span class="badge badge-primary">${exp.category}</span></td>
            <td>${exp.description || '-'}</td>
            <td>${exp.vendor || '-'}</td>
            <td>${API.formatDate(exp.expenseDate)}</td>
            <td>${exp.paymentMethod}</td>
            <td style="font-weight: 700; color: var(--danger);">${API.formatCurrency(exp.amount, biz.currency)}</td>
            <td>
              <button class="btn btn-secondary btn-sm" onclick='editExpense(${JSON.stringify(exp)})'>Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteExpense(${exp.id})">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        API.showToast(err.message, 'error');
      }
    }

    function openExpenseModal() {
      document.getElementById('editExpenseId').value = '';
      document.getElementById('modalTitle').innerText = 'Record Business Expense';
      document.getElementById('expenseForm').reset();
      document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('expenseModal').classList.add('active');
    }

    function editExpense(exp) {
      document.getElementById('editExpenseId').value = exp.id;
      document.getElementById('modalTitle').innerText = 'Edit Expense';
      document.getElementById('expCategory').value = exp.category;
      document.getElementById('expAmount').value = exp.amount;
      document.getElementById('expDate').value = exp.expenseDate;
      document.getElementById('expMethod').value = exp.paymentMethod;
      document.getElementById('expVendor').value = exp.vendor || '';
      document.getElementById('expDesc').value = exp.description || '';
      document.getElementById('expenseModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('expenseModal').classList.remove('active');
    }

    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const biz = API.storage.getActiveBusiness();
      const id = document.getElementById('editExpenseId').value;

      const payload = {
        category: document.getElementById('expCategory').value,
        amount: parseFloat(document.getElementById('expAmount').value),
        expenseDate: document.getElementById('expDate').value,
        paymentMethod: document.getElementById('expMethod').value,
        vendor: document.getElementById('expVendor').value.trim(),
        description: document.getElementById('expDesc').value.trim()
      };

      try {
        if (id) {
          await API.request(`/businesses/${biz.businessId}/expenses/${id}`, {
            method: 'PATCH',
            body: JSON.stringify(payload)
          });
          API.showToast('Expense updated successfully', 'success');
        } else {
          await API.request(`/businesses/${biz.businessId}/expenses`, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          API.showToast('Expense recorded successfully', 'success');
        }
        closeModal();
        loadExpenses();
        loadFinancialReport();
      } catch (err) {
        API.showToast(err.message, 'error');
      }
    });

    async function deleteExpense(id) {
      if (!confirm('Are you sure you want to delete this expense entry?')) return;
      const biz = API.storage.getActiveBusiness();
      try {
        await API.request(`/businesses/${biz.businessId}/expenses/${id}`, { method: 'DELETE' });
        API.showToast('Expense deleted', 'success');
        loadExpenses();
        loadFinancialReport();
      } catch (err) {
        API.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
