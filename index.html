<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VyaparOS — One platform. Your entire business.</title>
  <link rel="icon" type="image/svg+xml" href="frontend/assets/brand/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="frontend/favicon.ico">
  <script>
    // Seamless immediate client-side redirection to frontend
    (function() {
      const target = "frontend/index.html" + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Loading VyaparOS...</h2>
  <p>If you are not redirected automatically, <a href="frontend/index.html">click here to open VyaparOS</a>.</p>
</body>
</html>
